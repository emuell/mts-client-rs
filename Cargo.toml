[package]
name = "mts-client-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Eduard Müller <mail@emuell.net>"]
description = "Safe Rust bindings for the ODDSound MTS-ESP microtuning client"
license = "0BSD"
repository = "https://github.com/emuell/mts-client-rs"
readme = "README.md"
categories = ["multimedia::audio", "api-bindings"]
keywords = ["audio", "midi", "microtonal", "tuning", "mts-esp"]
links = "mtsclient"
exclude = [
    # Exclude prebuilt libMTS binaries and installers.
    "vendor/MTS-ESP/libMTS/**",
    # Exclude master-side API, which is not wrapped here.
    "vendor/MTS-ESP/Master/**",
    "vendor/MTS-ESP/.github/**",
]

[build-dependencies]
cc = "1.4"
